<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF PANEL - @OTMAN_NOOB</title>
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070510;
            --panel-bg: rgba(13, 9, 26, 0.85);
            --border-purple: #4a1c6b;
            --neon-purple: #b026ff;
            --neon-blue: #00d2ff;
            --text-main: #ffffff;
            --text-dim: #8c8c9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            /* خلفية مموهة بألوان Free Fire */
            background-image: radial-gradient(circle at 50% 0%, #2a0845 0%, #070510 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الحاوية الرئيسية */
        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* الشعار والهيدر */
        .header-banner {
            text-align: center;
            padding: 20px;
            position: relative;
        }
        .header-banner h1 {
            font-size: 40px;
            font-weight: 900;
            font-style: italic;
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
            margin-bottom: 5px;
        }
        .header-banner p {
            color: var(--neon-purple);
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* تخطيط الشاشة (بانل يمين وبانل يسار) */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* تنسيق البطاقات (Panels) */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-purple);
            border-radius: 8px; /* حواف مستقيمة قليلاً كما طلبت سابقاً */
            padding: 20px;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.1) inset, 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2a1b3d;
            padding-bottom: 10px;
        }
        .section-title i { color: var(--neon-purple); }
        .section-title span { font-size: 10px; color: var(--text-dim); display: block; }

        /* صفوف الإدخال */
        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background: #110b1a;
            border: 1px solid #2a1b3d;
            border-radius: 4px;
            transition: 0.3s;
        }
        .input-row:focus-within {
            border-color: var(--neon-purple);
            box-shadow: 0 0 8px rgba(176, 38, 255, 0.3);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a0f29;
            color: var(--neon-purple);
            border-left: 1px solid #2a1b3d;
        }

        .input-row input, .input-row select {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
        }
        
        .input-row select option { background: var(--bg-dark); }
        .input-row input::placeholder { color: var(--text-dim); font-size: 12px;}

        /* زر التنفيذ */
        .execute-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(90deg, #b026ff 0%, #00d2ff 100%);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .execute-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.5);
        }
        .execute-btn:disabled {
            background: #333;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* صندوق السجل LOG */
        .log-box {
            height: 100%;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }
        .log-content {
            flex: 1;
            background: #0a0612;
            border: 1px solid #2a1b3d;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            direction: ltr; /* الكود يظهر من اليسار لليمين */
            text-align: left;
        }
        
        .log-line { margin-bottom: 5px; line-height: 1.4; word-break: break-all; }
        .log-white { color: #fff; }
        .log-red { color: #ff4444; }
        .log-green { color: #00ff88; }
        .log-blue { color: #00d2ff; }
        .log-orange { color: #ffaa00; }

        /* الفوتر */
        .footer {
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 10px;
        }
        .footer span { color: var(--neon-purple); font-weight: bold; }

        /* التجاوب مع الهواتف */
        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .header-banner h1 { font-size: 30px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <!-- الهيدر -->
    <div class="header-banner">
        <h1>FF PANEL</h1>
        <p><i class="fas fa-bolt"></i> @OTMAN_NOOB</p>
    </div>

    <!-- الشبكة (بانل البيانات + بانل السجل) -->
    <div class="grid-layout">
        
        <!-- البانل الأيسر: المدخلات -->
        <div class="panel">
            
            <!-- قسم الحساب -->
            <div class="section-title">
                <i class="fas fa-user-shield"></i>
                <div>
                    بيانات حسابك
                    <span>ACCOUNT INFO</span>
                </div>
            </div>

            <div class="input-row">
                <div class="icon-box"><i class="fas fa-user"></i></div>
                <input type="number" id="user_uid" placeholder="أدخل الـ UID الخاص بك">
            </div>

            <div class="input-row">
                <div class="icon-box"><i class="fas fa-lock"></i></div>
                <input type="password" id="user_pass" placeholder="أدخل الباسورد الخاص بك">
            </div>

            <!-- قسم العملية -->
            <div class="section-title" style="margin-top: 25px;">
                <i class="fas fa-crosshairs"></i>
                <div>
                    بيانات العملية
                    <span>ACTION INFO</span>
                </div>
            </div>

            <div class="input-row">
                <div class="icon-box"><i class="fas fa-globe"></i></div>
                <select id="server">
                    <option value="ME">ME Server</option>
                </select>
            </div>

            <div class="input-row">
                <div class="icon-box"><i class="fas fa-cog"></i></div>
                <select id="action">
                    <option value="add">Add Friend</option>
                    <option value="remove">Remove Friend</option>
                </select>
            </div>

            <div class="input-row">
                <div class="icon-box"><i class="fas fa-bullseye"></i></div>
                <input type="number" id="target_id" placeholder="أدخل ID اللاعب المستهدف">
            </div>

            <!-- زر التنفيذ -->
            <button class="execute-btn" id="executeBtn" onclick="execute()">
                <i class="fas fa-bolt"></i> EXECUTE
            </button>
        </div>

        <!-- البانل الأيمن: السجل -->
        <div class="panel log-box">
            <div class="section-title">
                <i class="fas fa-terminal"></i>
                <div>
                    السجل
                    <span>LOG OUTPUT</span>
                </div>
            </div>
            <div class="log-content" id="logBox">
                <div class="log-line log-dim">[System] Ready...</div>
            </div>
        </div>

    </div>

    <!-- الفوتر -->
    <div class="footer">
        MADE BY <span>@OTMAN_NOOB</span>
    </div>

</div>

<script>
    async function execute() {
        const btn = document.getElementById('executeBtn');
        const logBox = document.getElementById('logBox');
        
        logBox.innerHTML = ''; // مسح السجل
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> WORKING...';

        const data = {
            user_uid: document.getElementById('user_uid').value,
            user_pass: document.getElementById('user_pass').value,
            server: document.getElementById('server').value,
            action: document.getElementById('action').value,
            target_id: document.getElementById('target_id').value
        };

        if (!data.user_uid || !data.user_pass) {
            appendLog(logBox, "خطأ: أدخل UID والباسورد الخاص بك أولاً", "red");
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-bolt"></i> EXECUTE';
            return;
        }

        try {
            const response = await fetch('/api/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            result.logs.forEach(log => {
                appendLog(logBox, log.text, log.color);
            });

            logBox.scrollTop = logBox.scrollHeight;

        } catch (err) {
            appendLog(logBox, "Connection error: " + err.message, "red");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-bolt"></i> EXECUTE';
        }
    }

    function appendLog(container, text, color) {
        const div = document.createElement('div');
        div.className = `log-line log-${color}`;
        
        // إضافة وقت للوج
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        div.innerText = `[${time}] ${text}`;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
